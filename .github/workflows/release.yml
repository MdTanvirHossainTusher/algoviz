name: release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: MdTanvirHossainTusher/publish-please@v0
        id: release
        with:
          token: ${{ secrets.RELEASE_TOKEN || github.token }}

      - if: steps.release.outputs.release_created == 'true'
        run: echo "released ${{ steps.release.outputs.tag_name }}"
